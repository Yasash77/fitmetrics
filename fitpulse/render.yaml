services:
  - type: web
    name: fitpulse-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: FITMETRICS_BASE_URL
        value: https://fitmetrics-api.onrender.com/api/v1
      - key: DEMO_API_KEY
        value: fp_demo_public_key
      - key: RATE_LIMIT_PER_MIN
        value: "60"
      - key: PYTHON_VERSION
        value: 3.12.4
