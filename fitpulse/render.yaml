# Render blueprint for FitPulse (paths are relative to the repository root)
services:
  - type: web
    name: fitpulse-api
    runtime: python
    rootDir: fitpulse/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: FITMETRICS_BASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.4
